[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-cnb-cache"
version = "0.1.0"
description = "MCP server exposing Czech National Bank exchange rates via a cnb-cache instance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz" }]
dependencies = ["fastmcp>=4.1.4", "httpx>=0.27"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
mcp-server-cnb-cache = "mcp_server_cnb_cache.server:main"

[project.urls]
Homepage = "https://github.com/Spoje-NET/mcp-server-cnb-cache"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
